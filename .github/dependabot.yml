# Dependabot configuration. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Version updates run monthly with one catch-all group per ecosystem, so each month brings at most one
# minor/patch PR per ecosystem (every merge into develop runs CI and a dev deploy). Major bumps stay
# ungrouped so each breaking change gets its own PR. Security updates ignore the schedule and still
# arrive as soon as an advisory is published, but open against the default branch (main), not develop.
version: 2
updates:
  # NuGet packages across the .NET solution. Dependabot resolves projects from .csproj files
  # under the listed directory, so a single root entry covers every project in the solution.
  - package-ecosystem: "nuget"
    directory: "/"
    # Releases flow develop -> main, so updates must land on develop like any other change.
    # Without this Dependabot targets the default branch (main) and bypasses that flow.
    target-branch: "develop"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "type: chore"
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    # Same reason as the nuget block above: land on develop, not the default branch.
    target-branch: "develop"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 3
    labels:
      - "type: chore"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
