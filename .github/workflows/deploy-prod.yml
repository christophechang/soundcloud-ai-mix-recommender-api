# .github/workflows/deploy-prod.yml
name: Deploy Prod (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit reference: short SHA or full SHA"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  ARTIFACT_NAME: mixrec-api
  CI_WORKFLOW_FILE: ci-build.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Resolve full SHA
        id: sha
        shell: bash
        run: |
          in="${{ inputs.ref }}"
          api_url="https://api.github.com/repos/${{ github.repository }}/commits/${in}"
          full_sha=$(curl -sS \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$api_url" | jq -r .sha)

          if [[ -z "$full_sha" || "$full_sha" == "null" ]]; then
            echo "Failed to resolve commit '$in' to a full SHA."
            exit 1
          fi

          echo "value=$full_sha" >> "$GITHUB_OUTPUT"

      - name: Find CI run id for this SHA (develop branch)
        id: cirun
        shell: bash
        run: |
          sha="${{ steps.sha.outputs.value }}"

          # Filter by head_sha server-side so the correct run is found regardless of how many
          # successful CI builds exist (the previous per_page=50 paging could miss it).
          runs_url="https://api.github.com/repos/${{ github.repository }}/actions/workflows/${{ env.CI_WORKFLOW_FILE }}/runs?head_sha=${sha}&status=success&per_page=20"
          run_id=$(curl -sS \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$runs_url" \
            | jq -r '.workflow_runs[0].id // empty')

          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "No successful CI run ($CI_WORKFLOW_FILE) found for SHA: $sha"
            echo "Make sure CI succeeded for that commit before deploying."
            exit 1
          fi

          echo "id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download artifact from CI run
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          run-id: ${{ steps.cirun.outputs.id }}
          path: ./package
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set App Service settings (prod)
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              { "name": "OpenAI__ApiKey",          "value": "${{ secrets.OPENAI_API_KEY }}",          "slotSetting": false },
              { "name": "Catalog__FlushSecret",     "value": "${{ secrets.CATALOG_FLUSH_SECRET }}",     "slotSetting": false },
              { "name": "MixLab__ApiSecret",        "value": "${{ secrets.MIXLAB_API_SECRET }}",        "slotSetting": false },
              { "name": "SoundCloud__ClientId",     "value": "${{ secrets.SOUNDCLOUD_CLIENT_ID }}",     "slotSetting": false },
              { "name": "SoundCloud__ClientSecret", "value": "${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}", "slotSetting": false },
              { "name": "Azure__MixLab__ServiceEndpoint", "value": "https://stchangstamixrecprod.blob.core.windows.net/", "slotSetting": false },
              { "name": "Azure__MixLab__ContainerName",   "value": "mixlab", "slotSetting": false }
            ]

      - name: Deploy to Azure Web App (prod)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: ./package
      # A deploy that changes how the schedule is computed leaves the cached response in
      # place, so the new build serves the old answer and looks like it never shipped.
      # This bit twice on 2026-08-04: v1.59's new field was absent until a manual flush,
      # and v1.60's retuned targets showed zero of 72 slots changed for the same reason.
      # The hourly OpenClaw agent invalidates on catalogue changes; nothing invalidated on
      # code changes until here.
      - name: Flush the catalogue cache
        shell: bash
        env:
          FLUSH_SECRET: ${{ secrets.CATALOG_FLUSH_SECRET }}
          API_BASE: https://api.changsta.com
        # The deploy is already live here, so nothing in this step fails the job except a
        # rejected secret (the flush would never work). The endpoint invalidates the cache and
        # rewarms in the background; a 524 (Cloudflare's 100 s limit) or timeout is reported
        # as a warning and the catalogue is then polled until it answers warm.
        run: |
          code=$(curl -sS -o /tmp/flush.out -w '%{http_code}' --max-time 60 -X POST \
            -H "Authorization: Bearer $FLUSH_SECRET" \
            "$API_BASE/api/catalog/flush" || true)

          echo "flush responded ${code:-no response}"
          cat /tmp/flush.out 2>/dev/null || true
          echo

          case "$code" in
            200)
              echo "cache invalidated; the catalogue rewarms in the background" ;;
            401|403)
              echo "::error::cache flush rejected ($code): the flush secret does not match the app setting. The deploy is live but clients keep the previous response until a flush succeeds."
              exit 1 ;;
            *)
              echo "::warning::cache flush did not confirm ($code). The deploy is live; if the request reached the app the cache is already invalidated. Checking the catalogue next." ;;
          esac

          for attempt in 1 2 3 4 5 6; do
            warm=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 95 "$API_BASE/api/catalog/genres" || true)
            if [ "$warm" = "200" ]; then
              echo "catalogue answered 200 on attempt $attempt: warm"
              exit 0
            fi
            echo "catalogue answered ${warm:-no response} on attempt $attempt; retrying in 15 s"
            sleep 15
          done

          echo "::warning::catalogue did not answer 200 after 6 attempts. The deploy is live; check /api/catalog and flush by hand if it still serves the previous response."
